spring:
  application:
    name: bill-api-generator
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        format_sql: true
        enable_lazy_load_no_trans: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DATABASE_URL:jdbc:postgresql://localhost:35050/bill_generator"}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:aaaaaa}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  # Configuración de Email para Hotmail/Outlook
  mail:
    host: smtp.office365.com
    port: 587
    username: ${EMAIL_USERNAME:tu-email@hotmail.com}
    password: ${EMAIL_PASSWORD:tu-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# Puerto del servidor
server:
  port: ${SERVER_PORT:8080}

# Logging
logging:
  level:
    com.bill_api_generator: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE